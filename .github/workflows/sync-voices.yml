name: Atualizar banco de vozes
on:
  schedule:
    - cron: '2,17,32,47 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/sync-voices.py
      - scripts/sync-voice-photos.py
      - .github/workflows/sync-voices.yml
      - assets/voice-bank.js
      - vozes/index.html
      - 'perfil-locutor-*/**'
permissions:
  contents: read
concurrency:
  group: sync-voices
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar parser
        run: pip install beautifulsoup4==4.13.4 html5lib==1.1 Pillow==11.3.0
      - name: Consultar e validar catálogo público
        run: python scripts/sync-voices.py
      - name: Atualizar fotos públicas em miniaturas leves
        run: python scripts/sync-voice-photos.py
      - name: Registrar catálogo validado
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/voices-catalog.json assets/voice-photos data/voice-photos-cache.json data/voice-profile-routes.json vozes/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'chore: sincroniza catálogo de vozes'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  publish:
    needs: sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - name: Publicar catálogo no site
        id: deployment
        uses: actions/deploy-pages@v4
