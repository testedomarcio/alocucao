name: Validar site A Locução
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/build-nova.py
      - run: python3 scripts/validate-nova.py
      - run: node scripts/test-nova.cjs
      - run: node scripts/test-premium.cjs
      - run: node --check assets/nova.js
      - run: node --check assets/tracking.js
